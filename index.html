<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Card Information</title>

<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        background:#f0f0f0;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .card-form{
        width:320px;
        background:white;
        padding:20px;
        box-shadow:0 4px 12px rgba(0,0,0,.3);
        border-radius:2px;
    }

    h2{
        margin-top:0;
        font-size:24px;
        color:#222;
    }

    label{
        display:block;
        margin-bottom:6px;
        font-weight:bold;
        font-size:14px;
    }

    .expiration{
        display:flex;
        gap:10px;
        margin-bottom:18px;
    }

    .expiration input{
        width:55px;
    }

    input[type="text"],
    select{
        width:100%;
        padding:8px;
        border:1px solid #cfcfcf;
        border-radius:2px;
        box-sizing:border-box;
        margin-bottom:18px;
    }

    .checkbox{
        display:flex;
        align-items:center;
        gap:8px;
        margin-bottom:18px;
        font-size:14px;
    }

    button{
        width:100%;
        background:#0d6efd;
        color:white;
        border:none;
        padding:10px;
        cursor:pointer;
        border-radius:2px;
        font-size:14px;
    }

    button:hover{
        background:#0b5ed7;
    }
</style>
</head>
<body>

<div class="card-form">
    <h2>Credit Card Information</h2>

    <label>Expiration Date:</label>
    <div class="expiration">
        <input type="text" placeholder="MM">
        <input type="text" placeholder="YY">
    </div>

    <label for="cardType">Credit Card Type:</label>
    <select id="cardType">
        <option selected disabled>Select</option>
        <option>VISA</option>
        <option>Mastercard</option>
        <option>American Express (AMEX)</option>
    </select>

    <div class="checkbox">
        <input type="checkbox" id="saveCard">
        <label for="saveCard" style="margin:0;font-weight:normal;">
            Save my credit card information
        </label>
    </div>

    <button type="submit">Submit</button>
</div>

</body>
</html>
