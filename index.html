<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Card Information</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .card-form {
        width: 350px;
        background: white;
        padding: 20px;
        box-shadow: 0 2px 10px rgba(0,0,0,.3);
    }

    h2 {
        margin-top: 0;
    }

    label {
        display: block;
        font-weight: bold;
        margin-top: 10px;
        margin-bottom: 5px;
    }

    .expiration {
        display: flex;
        gap: 10px;
    }

    .expiration input,
    select {
        padding: 8px;
        width: 100%;
        box-sizing: border-box;
    }

    .checkbox {
        margin-top: 15px;
    }

    button {
        width: 100%;
        margin-top: 15px;
        padding: 10px;
        background: #0d6efd;
        color: white;
        border: none;
        cursor: pointer;
    }

    .message {
        margin-top: 15px;
        font-weight: bold;
    }

    .success {
        color: green;
    }

    .error {
        color: red;
    }
</style>
</head>
<body>

<div class="card-form">

    <h2>Credit Card Information</h2>

    <form id="cardForm">

        <label>Expiration Date</label>

        <div class="expiration">
            <input
                type="number"
                id="month"
                placeholder="MM"
                min="1"
                max="12"
                required>

            <input
                type="number"
                id="year"
                placeholder="YYYY"
                required>
        </div>

        <label for="cardType">Credit Card Type</label>

        <select id="cardType" required>
            <option value="">Select</option>
            <option value="VISA">VISA</option>
            <option value="MASTERCARD">MASTERCARD</option>
            <option value="AMEX">AMEX</option>
        </select>

        <div class="checkbox">
            <input type="checkbox" id="saveCard">
            <label for="saveCard" style="display:inline;font-weight:normal;">
                Save my credit card information
            </label>
        </div>

        <button type="submit">Submit</button>

    </form>

    <div id="message" class="message"></div>

    </form>

    <button type="button" id="btnClean">Clean</button>

    <div id="message" class="message"></div>

</div>

<script>

document.getElementById("cardForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const month = parseInt(document.getElementById("month").value);
    const year = parseInt(document.getElementById("year").value);
    const cardType = document.getElementById("cardType").value;
    const saveCard = document.getElementById("saveCard").checked;

    const message = document.getElementById("message");

    message.className = "message";
    message.textContent = "";

    const today = new Date();

    const expirationDate = new Date(year, month - 1, 1);
    expirationDate.setMonth(expirationDate.getMonth() + 1);

    // Regla 1: no vencida

    if (expirationDate <= today) {
        message.classList.add("error");
        message.textContent =
            "Error: la tarjeta está vencida.";
        return;
    }

    // Regla 2: máximo 10 años

    const maxDate = new Date();
    maxDate.setFullYear(maxDate.getFullYear() + 10);

    if (expirationDate > maxDate) {
        message.classList.add("error");
        message.textContent =
            "Error: la fecha no puede superar los 10 años desde hoy.";
        return;
    }

    // Regla 3: validaciones para guardar

    if (saveCard) {

        const monthsDifference =
            (year - today.getFullYear()) * 12 +
            (month - (today.getMonth() + 1));

        if (cardType === "AMEX") {

            if (monthsDifference < 3) {
                message.classList.add("error");
                message.textContent =
                    "AMEX requiere una vigencia mínima de 3 meses para guardar la tarjeta.";
                return;
            }
        }

        if (
            cardType === "VISA" ||
            cardType === "MASTERCARD"
        ) {

            if (monthsDifference < 6) {
                message.classList.add("error");
                message.textContent =
                    "VISA y MASTERCARD requieren una vigencia mínima de 6 meses para guardar la tarjeta.";
                return;
            }
        }
    }

    message.classList.add("success");
    message.textContent =
        "Validación correcta. Datos aceptados.";

});

document.getElementById("btnClean").addEventListener("click", function () {

    document.getElementById("month").value = "";
    document.getElementById("year").value = "";
    document.getElementById("cardType").selectedIndex = 0;
    document.getElementById("saveCard").checked = false;

    const message = document.getElementById("message");
    message.textContent = "";
    message.className = "message";
});

</script>


</body>
</html>
